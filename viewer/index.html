<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASVspoof 2019 LA viewer</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header>
  <b>ASVspoof 2019 LA</b>
  <select id="f-split"></select>
  <select id="f-label"></select>
  <select id="f-system"></select>
  <select id="f-gender"></select>
  <input id="f-q" type="search" placeholder="id / speaker / hash  (/)">
  <label title="only flagged clips"><input id="f-flag" type="checkbox">flagged</label>
  <label title="only clips whose audio is identical to another clip"><input id="f-dup" type="checkbox">dups</label>
  <button id="reset">reset</button>
  <span id="stats"></span>
</header>
<main>
  <section id="left">
    <div id="hists"></div>
    <table id="counts"></table>
  </section>
  <section id="mid">
    <div id="thead"></div>
    <div id="tbody"><div id="spacer"></div><div id="rows"></div></div>
  </section>
  <section id="right">
    <div id="meta"></div>
    <div id="viz">
      <canvas id="wave"></canvas>
      <canvas id="spec"></canvas>
      <div id="head"></div>
    </div>
    <div id="ctrl">
      <button id="b-prev" title="previous (k / ↑)">◀</button>
      <button id="b-play" title="play / pause (space)">▶</button>
      <button id="b-next" title="next (j / ↓)">▶▶</button>
      <button id="b-rand" title="random clip in the current filter (r)">random</button>
      <label title="play when a clip is selected (a)"><input id="b-auto" type="checkbox" checked>autoplay</label>
      <label title="go to the next clip when one ends (c)"><input id="b-chain" type="checkbox">chain</label>
      <span id="time"></span>
    </div>
    <div id="flagbox">
      <input id="flag-note" placeholder="note  (f)">
      <button id="flag-save" title="save flag (enter)">flag</button>
      <button id="flag-clear">unflag</button>
    </div>
    <audio id="audio"></audio>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
